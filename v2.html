<style>
    :root {
        --shaka-thumb-color: #3b82f6;
        --shaka-track-color: #3b82f6;
        --shaka-font-family: 'Inter Variable', system-ui, sans-serif;
    }
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
    .video-container { width: 100%; height: 100%; }
    #shaka-video { width: 100%; height: 100%; background: #000; display: block; pointer-events: auto; }
    .video-js { width: 100%; height: 100%; }
    .vjs-big-play-centered .vjs-big-play-button { top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .hidden { display: none !important; }
    #mpegts-video { width: 100%; height: 100%; background: #000; display: block; }
    #tlo-wrap { width: 100%; height: 100%; }
    #tlo-wrap .tlop { height: 100%; aspect-ratio: auto; border-radius: 0; }
</style>
<style id="tlo-player-css">

.tlop{--ac:#3b82f6;position:relative;width:100%;aspect-ratio:16/9;background:radial-gradient(120% 90% at 50% 0%,rgba(59,130,246,.16) 0%,rgba(59,130,246,0) 60%),linear-gradient(160deg,#1c2533 0%,#10151f 55%,#1a1530 100%);border-radius:8px;overflow:hidden;font-family:'Inter Variable',Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none;color:#f3f5f8;outline:none}
.tlop:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}
.tlop *{box-sizing:border-box}
.tlop-v{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:transparent}
.tlop button{margin:0;font-family:inherit}

.tlop-top,.tlop-bot{position:absolute;left:0;right:0;z-index:3;pointer-events:none;transition:opacity .25s}
.tlop-top{top:0;height:90px;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,0))}
.tlop-bot{bottom:0;height:170px;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0))}
.tlop-line{position:absolute;left:16px;right:16px;bottom:64px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);z-index:4;transition:opacity .25s,height .12s;cursor:pointer;touch-action:none}
.tlop-line::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.tlop-line i{display:block;height:100%;width:0;border-radius:2px;background:var(--ac);pointer-events:none}
.tlop-th{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:scale(0);transition:transform .12s;pointer-events:none}
.tlop-line:hover,.tlop-line.tlop-drag{height:6px}
.tlop-line:hover .tlop-th,.tlop-line.tlop-drag .tlop-th{transform:scale(1)}
.tlop-tip{position:absolute;bottom:14px;left:0;transform:translateX(-50%);padding:3px 8px;border-radius:6px;background:#000;color:#fff;font:600 12px 'Inter Variable',Inter,system-ui,sans-serif;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tlop-line:hover .tlop-tip,.tlop-line.tlop-drag .tlop-tip{opacity:1}
.tlop-bk{color:#d5dae3;font:600 12px 'Inter Variable',Inter,system-ui,sans-serif;margin-right:8px;font-variant-numeric:tabular-nums}
.tlop-dir.tlop-off{background:rgba(255,255,255,.12);color:#c3c9d4}
.tlop-dir.tlop-off i{background:#8b93a1}
.tlop.tlop-noseek .tlop-line{display:none}
.tlop-bar{position:absolute;left:8px;right:8px;bottom:8px;height:48px;display:flex;align-items:center;gap:2px;z-index:5;transition:opacity .25s}
.tlop-sp1{flex:1 1 0}
.tlop.tlop-hid .tlop-top,.tlop.tlop-hid .tlop-bot,.tlop.tlop-hid .tlop-line,.tlop.tlop-hid .tlop-bar{opacity:0;pointer-events:none}
.tlop.tlop-hid{cursor:none}

.tlop-b{display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;border-radius:10px;background:transparent;color:#f3f5f8;cursor:pointer;position:relative}
.tlop-b:hover{background:rgba(255,255,255,.14)}
.tlop-b:focus-visible,.tlop-dir:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.tlop-b.tlop-on,.tlop-b.tlop-open{background:rgba(255,255,255,.2)}
.tlop-b.tlop-nocc{opacity:.6}
.tlop-vol{width:84px;accent-color:#fff;margin:0 6px 0 0;height:4px;cursor:pointer}
.tlop-dir{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;margin-right:6px;border:0;border-radius:999px;background:rgba(239,68,68,.18);color:#ffb4b4;font:700 12px 'Inter Variable',Inter,system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
.tlop-dir i{width:8px;height:8px;border-radius:50%;background:#ef4444}
.tlop-dot{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:#6b7280}
.tlop-dot.tlop-ok{background:#22c55e}.tlop-dot.tlop-mid{background:#f59e0b}.tlop-dot.tlop-bad{background:#ef4444}
.tlop-qn{position:absolute;right:3px;bottom:5px;padding:1px 4px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font:700 10px/1.2 'Inter Variable',Inter,system-ui,sans-serif;font-style:normal;pointer-events:none;display:none}
.tlop-bm{display:none}
.tlop-ccw{position:relative;display:block}

.tlop-ov{position:absolute;left:10%;right:10%;bottom:24px;text-align:center;pointer-events:none;z-index:4;transition:bottom .25s}
.tlop:not(.tlop-hid) .tlop-ov{bottom:112px}
.tlop-sl{position:absolute;left:10%;right:10%;bottom:24px;text-align:center;pointer-events:none;z-index:4;transition:bottom .25s}
.tlop:not(.tlop-hid) .tlop-sl{bottom:112px}
.tlop.tlop-stop .tlop-sl,.tlop.tlop-stop:not(.tlop-hid) .tlop-sl{bottom:auto;top:70px}
.tlop-sl span{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;background:#000;color:#fff;font-size:14px;line-height:1.3}
.tlop-sl i{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--ac);animation:tlop-spin .9s linear infinite}
.tlop-ov span{display:inline-block;padding:4px 12px;border-radius:4px;background:var(--sbg,rgba(0,0,0,.78));color:var(--sfg,#fff);font-size:calc(clamp(14px,2.2vw,21px)*var(--ssz,1));font-family:var(--sff,inherit);text-shadow:var(--ssh,none);line-height:1.35;white-space:pre-line}
.tlop.tlop-stop .tlop-ov,.tlop.tlop-stop:not(.tlop-hid) .tlop-ov{bottom:auto;top:70px}

.tlop-menu{display:none;position:absolute;width:210px;overflow-y:auto;overscroll-behavior:contain;padding:6px;border-radius:14px;background:#000;border:0;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:8;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent}
.tlop-menu,.tlop-panel{right:12px;bottom:68px;max-width:calc(100% - 24px)}
.tlop-arw{display:none;position:absolute;z-index:8;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #000;pointer-events:none}
.tlop-menu .tlop-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 2px 12px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#aab2c0}
.tlop-menu .tlop-mx{display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:28px;height:28px;padding:0;border-radius:8px;color:#aab2c0;font-size:12px;line-height:1}
.tlop-menu .tlop-mx:hover{background:rgba(255,255,255,.1);color:#fff}
.tlop-menu button{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#f3f5f8;font:14px 'Inter Variable',Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
.tlop-menu button:hover{background:rgba(255,255,255,.08)}
.tlop-menu button.tlop-on{background:rgba(255,255,255,.10)}
.tlop-menu button b{width:18px;color:var(--ac);display:flex}
.tlop-menu .tlop-nt{padding:8px 12px 10px;font-size:13px;line-height:1.45;color:#c3cad6}
.tlop-menu .tlop-sep{height:1px;background:rgba(255,255,255,.1);margin:6px 4px}
.tlop-panel{display:none;position:absolute;width:290px;overflow:auto;padding:12px;border-radius:14px;background:#000;border:0;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:8;color:#f3f5f8;font:13px 'Inter Variable',Inter,system-ui,sans-serif;cursor:default;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent}
.tlop-hset{width:300px}
.tlop-menu::-webkit-scrollbar,.tlop-panel::-webkit-scrollbar{width:8px}
.tlop-menu::-webkit-scrollbar-track,.tlop-panel::-webkit-scrollbar-track{background:transparent;margin:8px 0}
.tlop-menu::-webkit-scrollbar-thumb,.tlop-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.tlop-menu::-webkit-scrollbar-thumb:hover,.tlop-panel::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.5);background-clip:padding-box}
.tlop-panel .tlop-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.06em;color:#aab2c0;margin-bottom:8px}
.tlop-panel .tlop-x{width:28px;height:28px;font-size:12px;color:#aab2c0;border-radius:8px}
.tlop-panel .tlop-f{margin:10px 0 4px;color:#aab2c0;font-size:12px}
.tlop-panel .tlop-g{display:flex;gap:4px;flex-wrap:wrap}
.tlop-panel .tlop-g button{flex:1 1 auto;min-height:32px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#f3f5f8;font:13px 'Inter Variable',Inter,system-ui,sans-serif;cursor:pointer}
.tlop-panel .tlop-g button.tlop-on{background:rgba(255,255,255,.22)}
.tlop-panel .tlop-g button.tlop-swb{width:32px;flex:0 0 32px;padding:0}
.tlop-panel input[type=range]{width:100%;accent-color:#fff;margin:4px 0}
.tlop-prev{margin-top:12px;padding:14px 8px;border-radius:8px;background:linear-gradient(135deg,#1c2b4d,#2b1c40);text-align:center}
.tlop-prev span{display:inline-block;padding:4px 12px;border-radius:4px;font-size:calc(16px*var(--ssz,1));color:var(--sfg,#fff);background:var(--sbg,rgba(0,0,0,.78));font-family:var(--sff,inherit);text-shadow:var(--ssh,none)}
.tlop-rs{margin-top:10px;width:100%;min-height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#f3f5f8;font:13px 'Inter Variable',Inter,system-ui,sans-serif;cursor:pointer}

.tlop-st2{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:2px}
.tlop-st2 i{width:10px;height:10px;border-radius:50%}
.tlop-sb{color:#aab2c0;font-size:12px;line-height:1.4;margin-bottom:10px}
.tlop-dg{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.tlop-dn{display:flex;align-items:center;gap:5px;flex:0 0 auto;color:#c3cad6;font-size:11px;white-space:nowrap}
.tlop-dn.tlop-ds{flex:0 1 auto;min-width:0}
.tlop-dn.tlop-ds span{overflow:hidden;text-overflow:ellipsis}
.tlop-dl{flex:1 1 0;min-width:24px}
@keyframes tlop-flow{to{stroke-dashoffset:-13}}
.tlop-ch{border-radius:8px;background:rgba(255,255,255,.05);padding:6px 6px 2px}
.tlop-cl{display:flex;justify-content:space-between;color:#8b94a5;font-size:11px;margin:2px 2px 8px}
.tlop-hset dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0 0}
.tlop-hset dt{color:#aab2c0;margin:0}.tlop-hset dd{margin:0;font-weight:600;text-align:right}

.tlop-psn{position:absolute;right:12px;top:12px;z-index:7;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:17px;background:rgb(0 0 0);border:0;color:#fff;font-weight:600;cursor:pointer}
.tlop-psn:hover{background:rgba(40,46,62,.92)}
.tlop-toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:7;padding:8px 16px;border-radius:999px;background:rgba(14,17,26,.85);color:#fff;font:600 14px 'Inter Variable',Inter,system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.tlop-toast.tlop-on{opacity:1}
.tlop-st{position:absolute;inset:0;z-index:6;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff}

.tlop-st{pointer-events:none}
.tlop-st button{pointer-events:auto}
.tlop-st.tlop-cg{background:rgba(10,13,22,.35)}
.tlop-st .tlop-t{font-size:16px;font-weight:600}
.tlop-st .tlop-d{font-size:13px;color:#aab2c0;padding:0 24px;line-height:1.4}
.tlop-st .tlop-r{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 14px 'Inter Variable',Inter,system-ui,sans-serif;cursor:pointer}
.tlop-st .tlop-r.tlop-r2{background:rgba(255,255,255,.16)}
.tlop-st svg.tlop-sp{animation:tlop-spin .9s linear infinite}
@keyframes tlop-spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .tlop-vol{display:none}
  .tlop-dir{margin-right:2px}
  .tlop-b[data-a=health],.tlop-b[data-a=audio],.tlop-b[data-a=quality],.tlop-b[data-a=emis],.tlop-b[data-a=pip]{display:none!important}
  .tlop-bm{display:flex}
  .tlop-ccm,.tlop-pm{width:190px}
  .tlop-menu button{height:36px;font-size:13px}
  .tlop-menu .tlop-h{padding:6px 10px 4px}
  .tlop-menu,.tlop-panel{right:8px;bottom:64px}
  .tlop-panel{padding:10px}
  .tlop-panel .tlop-f{margin:8px 0 3px}
  .tlop-panel .tlop-g button{min-height:30px;padding:0 8px}
  .tlop-prev{margin-top:8px;padding:8px 6px}
}
@media(max-height:420px){.tlop-menu,.tlop-panel{bottom:60px}}

.tlop.tlop-sched .tlop-b[data-a=play],.tlop.tlop-sched .tlop-dir,.tlop.tlop-sched .tlop-line,.tlop.tlop-sched .tlop-bk{display:none!important}

</style>
</head>
<body>

<div id="shaka-wrap" class="video-container hidden" oncontextmenu="return false;">
    <div data-shaka-player-container id="player-container" class="video-container" oncontextmenu="return false;">
        <video data-shaka-player id="shaka-video" autoplay playsinline muted disablePictureInPicture
               controlsList="nodownload noremoteplayback noplaybackrate"
               oncontextmenu="return false;"></video>
    </div>
</div>

<div id="vjs-wrap" class="video-container hidden" oncontextmenu="return false;">
    <video-js id="vjs-player" class="video-js vjs-default-skin vjs-big-play-centered"
              controls preload="auto" playsinline muted
              oncontextmenu="return false;"></video-js>
</div>

<div id="tlo-wrap" class="video-container hidden" oncontextmenu="return false;"></div>

<div id="mpegts-wrap" class="video-container hidden" oncontextmenu="return false;">
    <video id="mpegts-video" autoplay playsinline muted controls oncontextmenu="return false;"></video>
</div>

<script>
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    var k = e.key;
    if (k === 'F12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) { e.preventDefault(); return; }
    if (e.ctrlKey && (k === 'u' || k === 'U' || k === 's' || k === 'S')) { e.preventDefault(); return; }
});
document.addEventListener('dragstart', function(e) { e.preventDefault(); });
</script>

            });
        } else {
            begin(engineFor());
        }
    }
});
</script>
