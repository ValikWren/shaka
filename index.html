<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor</title>

<link rel="stylesheet" type="text/css" referrerpolicy="no-referrer" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.0/controls.min.css">
<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/mux.js@5.5.3/dist/mux.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.0/shaka-player.ui.js"></script>
<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-eme@5.0.1/dist/videojs-contrib-eme.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>

<style>
    :root {
        --shaka-thumb-color: #3b82f6;
        --shaka-track-color: #3b82f6;
        --shaka-font-family: 'Inter Variable', system-ui, sans-serif;
    }
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
    .video-container { width: 100%; height: 100%; }
    #shaka-video { width: 100%; height: 100%; background: #000; display: block; pointer-events: auto; }
    .video-js { width: 100%; height: 100%; }
    .vjs-big-play-centered .vjs-big-play-button { top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .hidden { display: none !important; }
    #mpegts-video { width: 100%; height: 100%; background: #000; display: block; }
</style>
</head>
<body>

<div id="shaka-wrap" class="video-container hidden" oncontextmenu="return false;">
    <div data-shaka-player-container id="player-container" class="video-container" oncontextmenu="return false;">
        <video data-shaka-player id="shaka-video" autoplay playsinline muted disablePictureInPicture
               controlsList="nodownload noremoteplayback noplaybackrate"
               oncontextmenu="return false;"></video>
    </div>
</div>

<div id="vjs-wrap" class="video-container hidden" oncontextmenu="return false;">
    <video-js id="vjs-player" class="video-js vjs-default-skin vjs-big-play-centered"
              controls preload="auto" playsinline muted
              oncontextmenu="return false;"></video-js>
</div>

<div id="mpegts-wrap" class="video-container hidden" oncontextmenu="return false;">
    <video id="mpegts-video" autoplay playsinline muted controls oncontextmenu="return false;"></video>
</div>

<script>
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    var k = e.key;
    if (k === 'F12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) { e.preventDefault(); return; }
    if (e.ctrlKey && (k === 'u' || k === 'U' || k === 's' || k === 'S')) { e.preventDefault(); return; }
});
document.addEventListener('dragstart', function(e) { e.preventDefault(); });
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var PARENT_ORIGIN = (function() {
        try { return new URL(document.referrer).origin; } catch (e) { return null; }
    })();

    function notifyParent(msg) {
        try { window.parent.postMessage(msg, PARENT_ORIGIN || '*'); } catch (e) {}
    }

    function b64urlDecode(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        return decodeURIComponent(escape(atob(s)));
    }

    function detectType(url) {
        var lower = url.split('?')[0].toLowerCase();
        if (lower.endsWith('.mpd')) return 'application/dash+xml';
        if (lower.endsWith('.m3u8')) return 'application/vnd.apple.mpegurl';
        if (lower.endsWith('.mp4')) return 'video/mp4';
        return 'application/vnd.apple.mpegurl';
    }

    var params = new URLSearchParams(window.location.search);
    var urlParam = params.get('u');
    var needsDrm = params.get('drm') === '1';
    var nameParam = params.get('name');

    if (nameParam) {
        try { document.title = b64urlDecode(nameParam); } catch (e) {}
    }

    if (!urlParam) {
        notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        return;
    }

    var mediaUrl;
    try {
        mediaUrl = b64urlDecode(urlParam);
    } catch (e) {
        notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        return;
    }

    if (needsDrm) {
        startShaka(mediaUrl);
    } else {
        startVideoJs(mediaUrl);
    }

    function startShaka(url) {
        document.getElementById('shaka-wrap').classList.remove('hidden');
        document.getElementById('vjs-wrap').classList.add('hidden');
        document.getElementById('mpegts-wrap').classList.add('hidden');

        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
            return;
        }

        var video = document.getElementById('shaka-video');
        var container = document.getElementById('player-container');
        var player = new shaka.Player(video);

        var ui = new shaka.ui.Overlay(player, container, video);
        ui.configure({
            controlPanelElements: [
                'play_pause',
                'time_and_duration',
                'spacer',
                'mute',
                'volume',
                'overflow_menu',
                'picture_in_picture',
                'fullscreen'
            ],
            overflowMenuButtons: ['quality', 'captions', 'playback_rate'],
            addSeekBar: true,
            seekBarColors: {
                base: 'rgba(255,255,255,0.3)',
                buffered: 'rgba(255,255,255,0.5)',
                played: '#3b82f6'
            }
        });

        player.addEventListener('buffering', function(event) {
            notifyParent({ type: 'PLAYER_STATE', state: event.buffering ? 'buffering' : 'playing' });
        });

        player.addEventListener('error', function(event) {
            var err = event.detail;
            var httpStatus = (err && err.data && err.data.length > 1) ? err.data[1] : null;
            notifyParent({ type: 'PLAYER_STATE', state: 'error', code: err ? err.code : null, httpStatus: httpStatus });
        });

        video.addEventListener('playing', function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'playing' });
        });

        window.addEventListener('message', function(event) {
            if (PARENT_ORIGIN && event.origin !== PARENT_ORIGIN) return;
            var msg = event.data;
            if (!msg || msg.type !== 'SET_VOLUME') return;
            if (typeof msg.muted === 'boolean') video.muted = msg.muted;
            if (typeof msg.volume === 'number') video.volume = msg.volume;
        });

        var _drmTimeout = setTimeout(function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        }, 10000);

        window.addEventListener('message', function drmListener(event) {
            if (PARENT_ORIGIN && event.origin !== PARENT_ORIGIN) return;
            var msg = event.data;
            if (!msg || msg.type !== 'DRM_KEYS') return;
            clearTimeout(_drmTimeout);
            window.removeEventListener('message', drmListener);

            try {
                player.configure({ drm: { clearKeys: msg.clearKeys } });
            } catch (e) {}

            (async function() {
                try {
                    await player.load(url);
                    video.muted = true;
                    video.play().catch(function() {});
                } catch (error) {
                    var httpStatus = (error && error.data && error.data.length > 1) ? error.data[1] : null;
                    notifyParent({ type: 'PLAYER_STATE', state: 'error', code: error ? error.code : null, httpStatus: httpStatus });
                }
            })();
        });

        window.addEventListener('beforeunload', function() {
            try { player.destroy(); } catch (e) {}
        });
    }

    function startVideoJs(url) {
        document.getElementById('vjs-wrap').classList.remove('hidden');
        document.getElementById('shaka-wrap').classList.add('hidden');
        document.getElementById('mpegts-wrap').classList.add('hidden');

        var player = videojs('vjs-player', {
            controls: true,
            autoplay: true,
            muted: true,
            playsinline: true,
            preload: 'auto',
            controlBar: {
                pictureInPictureToggle: true,
                playbackRateMenuButton: true
            }
        });

        if (player.eme) player.eme();

        player.on('waiting', function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'buffering' });
        });
        player.on('playing', function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'playing' });
        });

        player.on('error', function() {
            var err = player.error();
            if (err && err.code === 4) {
                console.warn('Video.js failed, trying mpegts.js');
                try {
                    player.dispose();
                } catch (e) {}
                startMpegTs(url);
                return;
            }
            notifyParent({
                type: 'PLAYER_STATE',
                state: 'error',
                code: err ? err.code : null,
                httpStatus: (err && err.status) ? err.status : null
            });
        });

        player.reloadSourceOnError({
            errorInterval: 5,
            getSource: function(reload) {
                reload({ src: url, type: detectType(url) });
            }
        });

        window.addEventListener('message', function(event) {
            if (PARENT_ORIGIN && event.origin !== PARENT_ORIGIN) return;
            var msg = event.data;
            if (!msg || msg.type !== 'SET_VOLUME') return;
            if (typeof msg.muted === 'boolean') player.muted(msg.muted);
            if (typeof msg.volume === 'number') player.volume(msg.volume);
        });

        player.src({
            src: url,
            type: detectType(url)
        });

        player.ready(function() {
            player.muted(true);
            var p = player.play();
            if (p && p.catch) p.catch(function() {});
        });

        window.addEventListener('beforeunload', function() {
            try { player.dispose(); } catch (e) {}
        });
    }

    function startMpegTs(url) {
        document.getElementById('mpegts-wrap').classList.remove('hidden');
        document.getElementById('vjs-wrap').classList.add('hidden');
        document.getElementById('shaka-wrap').classList.add('hidden');

        var videoElement = document.getElementById('mpegts-video');

        if (!window.mpegts || !mpegts.getFeatureList().mseLivePlayback) {
            notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
            return;
        }

        var player = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: url
        });

        player.attachMediaElement(videoElement);
        player.load();

        player.on(mpegts.Events.ERROR, function(type, detail, info) {
            notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        });

        videoElement.addEventListener('playing', function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'playing' });
        });
        videoElement.addEventListener('waiting', function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'buffering' });
        });

        window.addEventListener('message', function(event) {
            if (PARENT_ORIGIN && event.origin !== PARENT_ORIGIN) return;
            var msg = event.data;
            if (!msg || msg.type !== 'SET_VOLUME') return;
            if (typeof msg.muted === 'boolean') videoElement.muted = msg.muted;
            if (typeof msg.volume === 'number') videoElement.volume = msg.volume;
        });

        videoElement.muted = true;
        var p = videoElement.play();
        if (p && p.catch) p.catch(function() {});

        window.addEventListener('beforeunload', function() {
            try {
                player.destroy();
            } catch (e) {}
        });
    }
});
</script>
</body>
</html>
