<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor</title>
<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-eme@5.0.1/dist/videojs-contrib-eme.min.js"></script>
<style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
    .video-container { width: 100%; height: 100%; }
    .video-js { width: 100%; height: 100%; }
    .vjs-big-play-centered .vjs-big-play-button { top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="video-container" oncontextmenu="return false;">
    <video-js id="player" class="video-js vjs-default-skin vjs-big-play-centered"
              controls preload="auto" playsinline muted
              oncontextmenu="return false;"></video-js>
</div>

<script>
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    var k = e.key;
    if (k === 'F12') { e.preventDefault(); return; }
    if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) { e.preventDefault(); return; }
    if (e.ctrlKey && (k === 'u' || k === 'U' || k === 's' || k === 'S')) { e.preventDefault(); return; }
});
document.addEventListener('dragstart', function(e) { e.preventDefault(); });
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var PARENT_ORIGIN = (function() {
        try { return new URL(document.referrer).origin; } catch (e) { return null; }
    })();

    function notifyParent(msg) {
        try { window.parent.postMessage(msg, PARENT_ORIGIN || '*'); } catch (e) {}
    }

    function b64urlDecode(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        return decodeURIComponent(escape(atob(s)));
    }

    function hexToBytes(hex) {
        hex = hex.replace(/^0x/, '');
        if (hex.length % 2 !== 0) hex = '0' + hex;
        var bytes = new Uint8Array(hex.length / 2);
        for (var i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes;
    }

    function bytesToBase64Url(bytes) {
        var binary = '';
        for (var i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function hexToBase64Url(hex) {
        return bytesToBase64Url(hexToBytes(hex));
    }

    function base64UrlToHex(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        var bin = atob(s);
        var out = '';
        for (var i = 0; i < bin.length; i++) {
            out += ('0' + bin.charCodeAt(i).toString(16)).slice(-2);
        }
        return out.toLowerCase();
    }

    function normalizeHexKey(value) {
        if (typeof value !== 'string') return value;
        if (/[^0-9a-fA-F]/.test(value)) {
            try { return base64UrlToHex(value); } catch (e) { return value; }
        }
        return value.toLowerCase();
    }

    function detectType(url) {
        var lower = url.split('?')[0].toLowerCase();
        if (lower.endsWith('.mpd')) return 'application/dash+xml';
        if (lower.endsWith('.m3u8')) return 'application/vnd.apple.mpegurl';
        if (lower.endsWith('.mp4')) return 'video/mp4';
        return 'application/vnd.apple.mpegurl';
    }

    var player = videojs('player', {
        controls: true,
        autoplay: true,
        muted: true,
        playsinline: true,
        preload: 'auto',
        controlBar: {
            pictureInPictureToggle: true,
            playbackRateMenuButton: true
        }
    });

    if (player.eme) player.eme();

    player.on('waiting', function() {
        notifyParent({ type: 'PLAYER_STATE', state: 'buffering' });
    });
    player.on('playing', function() {
        notifyParent({ type: 'PLAYER_STATE', state: 'playing' });
    });
    player.on('error', function() {
        var err = player.error();
        notifyParent({
            type: 'PLAYER_STATE',
            state: 'error',
            code: err ? err.code : null,
            httpStatus: (err && err.status) ? err.status : null
        });
    });

    window.addEventListener('message', function(event) {
        if (PARENT_ORIGIN && event.origin !== PARENT_ORIGIN) return;
        var msg = event.data;
        if (!msg || msg.type !== 'SET_VOLUME') return;
        if (typeof msg.muted === 'boolean') player.muted(msg.muted);
        if (typeof msg.volume === 'number') player.volume(msg.volume);
    });

    var params = new URLSearchParams(window.location.search);
    var urlParam = params.get('u');
    var needsDrm = params.get('drm') === '1';
    var nameParam = params.get('name');

    if (nameParam) {
        try { document.title = b64urlDecode(nameParam); } catch (e) {}
    }

    if (!urlParam) {
        notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        return;
    }

    var mediaUrl;
    try {
        mediaUrl = b64urlDecode(urlParam);
    } catch (e) {
        notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        return;
    }

    function loadSource(url, clearKeys) {
        var srcOptions = {
            src: url,
            type: detectType(url)
        };

        if (clearKeys) {
            var keysHex = {};
            for (var kid in clearKeys) {
                keysHex[normalizeHexKey(kid)] = normalizeHexKey(clearKeys[kid]);
            }

            srcOptions.keySystems = {
                'org.w3.clearkey': {
                    getLicense: function(emeOptions, keyMessage, callback) {
                        try {
                            var request = JSON.parse(new TextDecoder().decode(keyMessage));
                            var kids = request.kids || [];
                            var jwkKeys = [];

                            for (var i = 0; i < kids.length; i++) {
                                var kidHex = base64UrlToHex(kids[i]);
                                var keyHex = keysHex[kidHex];

                                if (!keyHex) {
                                    keyHex = clearKeys[kidHex] || clearKeys[kids[i]];
                                }

                                if (!keyHex) {
                                    callback(new Error('key not found'));
                                    return;
                                }

                                jwkKeys.push({
                                    kty: 'oct',
                                    alg: 'A128KW',
                                    kid: kids[i],
                                    k: hexToBase64Url(keyHex)
                                });
                            }

                            var license = JSON.stringify({ keys: jwkKeys });
                            callback(null, new TextEncoder().encode(license));
                        } catch (err) {
                            callback(err);
                        }
                    }
                }
            };
        }

        player.src(srcOptions);
        player.ready(function() {
            player.muted(true);
            var p = player.play();
            if (p && p.catch) p.catch(function() {});
        });
    }

    if (needsDrm) {
        var _drmTimeout = setTimeout(function() {
            notifyParent({ type: 'PLAYER_STATE', state: 'error', code: null, httpStatus: null });
        }, 10000);

        window.addEventListener('message', function drmListener(event) {
            if (PARENT_ORIGIN && event.origin !== PARENT_ORIGIN) return;
            var msg = event.data;
            if (!msg || msg.type !== 'DRM_KEYS') return;
            clearTimeout(_drmTimeout);
            window.removeEventListener('message', drmListener);
            loadSource(mediaUrl, msg.clearKeys);
        });
    } else {
        loadSource(mediaUrl, null);
    }

    window.addEventListener('beforeunload', function() {
        try { player.dispose(); } catch (e) {}
    });
});
</script>
</body>
</html>
